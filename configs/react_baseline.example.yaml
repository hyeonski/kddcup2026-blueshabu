dataset:
  root_path: data/public/input

agent:
  # Model access priority: env > YAML > default.
  # During official evaluation, MODEL_API_URL / MODEL_API_KEY / MODEL_NAME
  # are injected by the grader and override these fields automatically.
  # Locally, prefer setting env vars instead of editing this file. Never commit real keys.
  model: qwen/qwen3.5-35b-a3b
  api_base: https://openrouter.ai/api/v1/
  api_key: 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
  max_steps: 100
  temperature: 1.0
  # ACON Context Optimization
  enable_context_optimization: true
  history_summarization_threshold: 7000
  preserve_last_k_steps: 4
  # Observation Memory: 오래된 observation을 외부 메모리에 분리 보관하고 recall_observation 도구로 재조회
  enable_observation_memory: true
  memory_index_head_chars: 200

run:
  output_dir: artifacts/runs
  # run_id 규칙:
  #   - 비워두거나 생략하면 타임스탬프+파라미터로 자동 생성 (예: 2605121658-T1.0-H15000-K5)
  #   - "{ts}" 플레이스홀더 → 짧은 타임스탬프(YYMMDDHHMM, 로컬 시간)로 치환
  #   - "{params}" 플레이스홀더 → T/H/K 등 핵심 파라미터로 치환
  #     예: "ACON-{ts}-{params}" → "ACON-2605121658-T1.0-H15000-K5"
  #   - 그 외 문자열은 그대로 사용 (legacy)
  # 어느 경우든 summary.json의 agent_config / started_at / git 필드에
  # 전체 파라미터·시각·commit 스냅샷이 함께 저장됨.
  run_id: BACK-TO-THE-V3-3
  max_workers: 1
  task_timeout_seconds: 900
