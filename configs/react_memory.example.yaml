dataset:
  root_path: data/public/input

agent:
  # Model access priority: env > YAML > default.
  model: MODEL
  api_base: API_BASE_URL
  api_key: API_KEY
  max_steps: 100
  temperature: 1.0
  # ACON Context Optimization — baseline과 동일하게 유지 (변수 통제)
  enable_context_optimization: true
  history_summarization_threshold: 7000
  preserve_last_k_steps: 5
  # Observation Memory: ON
  # 오래된 observation을 외부 메모리로 분리, 컨텍스트에는 <MEMORY_INDEX>만 노출.
  # ACON 압축에서도 observation 본문 제외 → 사실 데이터 corruption 가설 직접 검증.
  enable_observation_memory: true
  memory_index_head_chars: 200
  # preserved-K 윈도우 안의 observation도 N자 초과면 잘라냄. 원본은 recall_observation으로.
  preserved_observation_max_chars: 5000

run:
  output_dir: artifacts/runs
  run_id: "MEM-{ts}-{params}"
  max_workers: 4
  task_timeout_seconds: 900
