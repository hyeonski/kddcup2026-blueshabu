dataset:
  root_path: /input

agent:
  # Evaluation injects MODEL_API_URL / MODEL_API_KEY / MODEL_NAME via env;
  # these YAML values are placeholders and are overridden at runtime.
  model: qwen3.5-35b-a3b
  api_base: http://placeholder
  api_key: placeholder
  max_steps: 50
  temperature: 1.0
  enable_context_optimization: true
  history_summarization_threshold: 4000

run:
  output_dir: /tmp/runs
  run_id: submission
  max_workers: 8
  task_timeout_seconds: 900
